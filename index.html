<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Fairycookies 店內價目表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf8;
    --card: #ffffff;
    --text: #1a1a1a;
    --text-light: #8a8a86;
    --line: #e8e8e4;
    --accent: #1a1a1a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  header {
    text-align: center;
    padding: 44px 20px 28px;
  }
  header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.18em;
  }
  header p {
    margin-top: 6px;
    font-size: 12px;
    letter-spacing: 0.3em;
    color: var(--text-light);
  }
  /* ── 篩選列 ── */
  .filters {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(250,250,248,0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 10px 0 12px;
  }
  .chip-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 20px;
    scrollbar-width: none;
  }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .chip-row.brands .chip { font-size: 12px; padding: 5px 13px; color: var(--text-light); }
  .chip-row.brands .chip.active { color: #fff; }
  /* ── 商品格 ── */
  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px 16px 80px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 20px; } }
  @media (min-width: 960px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .item {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .item .ph {
    aspect-ratio: 1/1;
    background: #f2f2ee;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .item .noimg {
    color: #c9c9c4;
    font-size: 11px;
    letter-spacing: 0.2em;
  }
  .item .info { padding: 9px 10px 11px; }
  .item .brand {
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--text-light);
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .item .name {
    font-size: 12px;
    font-weight: 500;
    line-height: 1.45;
    margin-bottom: 8px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 2.9em;
  }
  .item .sub {
    font-size: 10px;
    color: var(--text-light);
    line-height: 1.4;
    margin: -4px 0 8px;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .item .price {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .item .price span { font-size: 11px; font-weight: 400; color: var(--text-light); margin-right: 3px; }
  /* ── 快取提示 ── */
  .cache-note {
    background: #fdf6e3;
    border: 1px solid #f0e6c8;
    color: #8a6d1a;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 16px;
    font-size: 12.5px;
    text-align: center;
  }
  /* ── 狀態 ── */
  .status {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-light);
    font-size: 13px;
    letter-spacing: 0.1em;
  }
  footer {
    text-align: center;
    padding: 0 20px 36px;
    font-size: 11px;
    color: #c0c0bb;
    letter-spacing: 0.15em;
  }
</style>
</head>
<body>

<header>
  <h1>FAIRYCOOKIES</h1>
  <p>店內價目表 PRICE LIST</p>
</header>

<div class="filters">
  <div class="chip-row cats" id="catRow"></div>
  <div class="chip-row brands" id="brandRow"></div>
</div>

<main>
  <div class="status" id="status">載入中…</div>
  <div class="grid" id="grid"></div>
</main>

<footer>價格如有異動，以現場標示為準</footer>

<script>
/* ════════ 設定 ════════ */
const SHEET_ID = '1_PhKE3DchkGUIKN0gSt_MHIrU7d5FtOHi54Xu_rchcQ';
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1`;

/* 類別顯示名稱（試算表內用英文代碼，這裡決定顯示文字與順序） */
const CAT_LABELS = {
  sofubi:   'Sofubi 軟膠',
  blindbox: '盲盒',
  gacha:    '扭蛋',
  plush:    '玩偶',
};

let items = [];
let curCat = 'all';
let curBrand = 'all';

/* ════════ 資料載入 ════════ */
async function load() {
  try {
    const res = await fetch(SHEET_URL);
    const text = await res.text();
    const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
    const cols = json.table.cols.map(c => (c.label || '').trim());
    const idx = {
      cat:   cols.findIndex(c => c.includes('類別')),
      brand: cols.findIndex(c => c.includes('品牌')),
      name:  cols.findIndex(c => c.includes('品名')),
      price: cols.findIndex(c => c.includes('售價')),
      img:   cols.findIndex(c => c.includes('圖片')),
      live:  cols.findIndex(c => c.includes('上架')),
    };
    items = json.table.rows
      .map(r => {
        const v = i => (i >= 0 && r.c[i] && r.c[i].v != null) ? String(r.c[i].v).trim() : '';
        // 品名與品牌依訂單格式為「日文＋換行＋英文」雙行
        const nameLines = v(idx.name).split('\n').map(s => s.trim()).filter(Boolean);
        const brandLines = v(idx.brand).split('\n').map(s => s.trim()).filter(Boolean);
        return {
          cat: v(idx.cat).toLowerCase(),
          brand: brandLines[brandLines.length - 1] || '',  // 取英文行
          name: nameLines[0] || '',
          nameEn: nameLines[1] || '',
          price: v(idx.price),
          img: driveUrl(v(idx.img)),
          live: v(idx.live).toUpperCase(),
        };
      })
      .filter(it => it.name && it.live !== 'N');
    if (!items.length) throw new Error('empty');
    render();
    // 成功載入後快取一份，之後若連線失敗可暫用
    try {
      localStorage.setItem('fc_cache', JSON.stringify({ t: Date.now(), items }));
    } catch (e) { /* 無痕模式等情況忽略 */ }
  } catch (e) {
    // 載入失敗 → 改用上次成功的快取資料
    let cached = null;
    try { cached = JSON.parse(localStorage.getItem('fc_cache')); } catch (e2) {}
    if (cached && Array.isArray(cached.items) && cached.items.length) {
      items = cached.items;
      render();
      const note = document.createElement('div');
      note.className = 'cache-note';
      const d = new Date(cached.t);
      note.textContent = `連線異常，目前顯示 ${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} 的價目表，正確價格請洽店員`;
      document.querySelector('main').prepend(note);
    } else {
      document.getElementById('status').textContent =
        '價目表暫時無法載入，請通知店員，謝謝！';
    }
  }
}

/* 將 Google Drive 分享連結自動轉成可顯示的圖片網址 */
function driveUrl(u) {
  if (!u) return '';
  const m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)([\w-]+)/);
  if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w600`;
  return u;
}

/* ════════ 畫面 ════════ */
function render() {
  renderChips();
  renderGrid();
}

function renderChips() {
  // 類別：依 CAT_LABELS 順序，再補上資料中出現的其他類別
  const seen = [...new Set(items.map(i => i.cat).filter(Boolean))];
  const ordered = Object.keys(CAT_LABELS).filter(c => seen.includes(c))
    .concat(seen.filter(c => !CAT_LABELS[c]));
  const catRow = document.getElementById('catRow');
  catRow.innerHTML = '';
  catRow.appendChild(chip('全部', 'all', curCat === 'all', c => { curCat = c; curBrand = 'all'; render(); }));
  ordered.forEach(c =>
    catRow.appendChild(chip(CAT_LABELS[c] || c, c, curCat === c, v => { curCat = v; curBrand = 'all'; render(); })));

  // 品牌：只顯示目前類別下的品牌
  const pool = curCat === 'all' ? items : items.filter(i => i.cat === curCat);
  const brands = [...new Set(pool.map(i => i.brand).filter(Boolean))].sort();
  const brandRow = document.getElementById('brandRow');
  brandRow.innerHTML = '';
  brandRow.style.display = brands.length ? '' : 'none';
  if (brands.length) {
    brandRow.appendChild(chip('全部品牌', 'all', curBrand === 'all', b => { curBrand = b; render(); }));
    brands.forEach(b =>
      brandRow.appendChild(chip(b, b, curBrand === b, v => { curBrand = v; render(); })));
  }
}

function chip(label, value, active, onclick) {
  const el = document.createElement('button');
  el.className = 'chip' + (active ? ' active' : '');
  el.textContent = label;
  el.onclick = () => onclick(value);
  return el;
}

function renderGrid() {
  const list = items.filter(i =>
    (curCat === 'all' || i.cat === curCat) &&
    (curBrand === 'all' || i.brand === curBrand));
  const grid = document.getElementById('grid');
  const status = document.getElementById('status');
  grid.innerHTML = '';
  status.textContent = list.length ? '' : '此分類目前沒有商品';
  status.style.display = list.length ? 'none' : '';
  list.forEach(it => {
    const card = document.createElement('div');
    card.className = 'item';
    const price = isNaN(Number(it.price)) ? it.price : Number(it.price).toLocaleString('zh-TW');
    card.innerHTML = `
      <div class="ph">${it.img
        ? `<img loading="lazy" alt="" onerror="this.parentNode.innerHTML='<div class=noimg>NO IMAGE</div>'">`
        : '<div class="noimg">NO IMAGE</div>'}</div>
      <div class="info">
        <div class="brand"></div>
        <div class="name"></div>
        <div class="price"><span>NT$</span>${price}</div>
      </div>`;
    card.querySelector('.brand').textContent = it.brand;
    card.querySelector('.name').textContent = it.name;
    if (it.img) card.querySelector('img').src = it.img;
    grid.appendChild(card);
  });
}

load();
</script>
</body>
</html>
